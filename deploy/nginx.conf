# Аниманга на nginx: статика из /var/www/animanga, весь раздел /private/ — только по паролю.
#
# Положить в /etc/nginx/sites-available/animanga, заменить DOMAIN на свой домен (два места),
# включить ссылкой в sites-enabled, проверить nginx -t, перезагрузить.
# HTTPS: certbot --nginx -d DOMAIN — он сам допишет 443 и редирект с http. Пароль для /private/
# заводите только после этого, иначе он пойдёт по сети открытым текстом.

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    root /var/www/animanga;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # ^~ обязателен: без него правила для .jpg ниже перехватили бы картинки из /private/ раньше,
    # чем nginx спросит пароль, и сканы отдавались бы всем
    location ^~ /private/ {
        auth_basic "Animanga private";
        auth_basic_user_file /etc/nginx/animanga.htpasswd;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "private, no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Код меняется без смены имён файлов — браузер каждый раз сверяется с сервером по ETag
    location ~* \.(html|js|css|json|svg)$ {
        add_header Cache-Control "no-cache";
    }

    # Страницы и слои меняются редко
    location ~* \.(jpg|jpeg|png|webp)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
