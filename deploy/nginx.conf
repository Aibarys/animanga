# Аниманга на nginx: статика из /var/www/animanga, вход и комментарии — служба animanga-api
# (server/animanga_api.py на 127.0.0.1:8087), раздел /private/ — только для владельца сайта.
#
# Положить в /etc/nginx/sites-available/animanga, заменить DOMAIN на свой домен (два места),
# включить ссылкой в sites-enabled, проверить nginx -t, перезагрузить.
# HTTPS: certbot --nginx -d DOMAIN — он сам допишет 443 и редирект с http. Аккаунт владельца
# заводите только после этого, иначе пароль пойдёт по сети открытым текстом.

# Подбор паролей и регистрацию ботами притормаживает ещё и nginx: 10 попыток в минуту с адреса
limit_req_zone $binary_remote_addr zone=animanga_auth:10m rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN;

    root /var/www/animanga;
    index index.html;
    charset utf-8;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Вход, регистрация, комментарии
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 16k;
    }
    location = /api/login {
        limit_req zone=animanga_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 16k;
    }
    location = /api/register {
        limit_req zone=animanga_auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8087;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 16k;
    }

    # Проверка для /private/: API отвечает 204, если вошёл владелец, и 401 всем остальным.
    # Если API не отвечает, nginx отдаёт 500 — раздел остаётся закрытым
    location = /_auth {
        internal;
        proxy_pass http://127.0.0.1:8087/api/auth;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host $host;
    }

    # ^~ обязателен: без него правила для .jpg ниже перехватили бы картинки из /private/ раньше
    # проверки входа, и сканы отдавались бы всем. Чужим — страница входа с кодом 401 по тому же адресу
    location ^~ /private/ {
        auth_request /_auth;
        error_page 401 /login/index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Cache-Control "private, no-cache" always;
        try_files $uri $uri/ =404;
    }

    # Код меняется без смены имён файлов — браузер каждый раз сверяется с сервером по ETag
    location ~* \.(html|js|css|json|svg)$ {
        add_header Cache-Control "no-cache";
    }

    # Страницы и слои меняются редко
    location ~* \.(jpg|jpeg|png|webp)$ {
        add_header Cache-Control "public, max-age=604800";
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
